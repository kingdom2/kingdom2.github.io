<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>مبيعات الميدان</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,Tahoma,sans-serif;background:#f4f6f5;color:#18211f;padding-bottom:70px}
main{padding:12px;max-width:640px;margin:auto}
input,select,textarea{font:inherit;padding:12px;border:1px solid #c5d0cc;border-radius:10px;width:100%;background:#fff;color:inherit}
button{font:inherit;background:#0f766e;color:#fff;border:0;min-height:46px;padding:0 16px;border-radius:10px;cursor:pointer}
button.sec{background:#e3ebe8;color:#18211f}button.danger{background:#b42318}
.row{background:#fff;border-radius:12px;padding:10px;margin:8px 0;display:flex;gap:10px;align-items:center}
.row input{width:24px;height:24px;flex:none}.t{flex:1}.muted{color:#5b6b66;font-size:14px}
.warn{background:#fff3cd;padding:10px;text-align:center}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:#fff;border-top:1px solid #d5dedb}
nav button{flex:1;font-size:12px;padding:0;background:none;color:#5b6b66;border-radius:0;min-height:56px}nav button.on{color:#0f766e;font-weight:700}
.fab{position:fixed;bottom:76px;inset-inline-start:16px;border-radius:50%;width:56px;height:56px;font-size:28px;padding:0}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:5}
#modal.on{display:flex}#modal>div{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:16px;border-radius:16px 16px 0 0}
label{display:block;margin:8px 0;font-size:14px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{display:inline-flex;gap:8px;background:#e3ebe8;border-radius:20px;padding:6px 12px;margin:3px}.chip b{cursor:pointer}canvas{width:100%;height:360px;border-radius:12px;display:block;touch-action:none;margin:8px 0}table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;font-size:14px}td,th{padding:8px;border-bottom:1px solid #e3ebe8;text-align:center}a.btn{display:block;text-align:center;background:#0f766e;color:#fff;padding:12px;border-radius:10px;margin:6px 0;text-decoration:none}.oc{display:flex;gap:6px;align-items:center;background:#e3ebe8;border-radius:12px;padding:12px;margin:4px 0;font-size:16px}.oc:has(input:checked){background:#0f766e;color:#fff}.sg{display:flex;gap:8px;align-items:center;padding:5px 0}.sg i{width:14px;height:14px;border-radius:50%;background:#c5d0cc;flex:none}.sg.done i{background:#16a34a}.sg.cur i{background:#0f766e;box-shadow:0 0 0 4px #0f766e33}.sg.cur span:nth-child(2){font-weight:700}.tag{background:#fde8e8;color:#b42318;border-radius:8px;padding:2px 8px;font-size:12px;margin:2px;display:inline-block}.rpt{color:#111;line-height:1.5}.rpt header{border-bottom:3px solid #0f766e;padding-bottom:8px;margin-bottom:10px}.rpt .co{font-size:18px;font-weight:700;color:#0f766e}.rpt h1{font-size:20px;margin:4px 0}.rpt h2{font-size:16px;background:#e3ebe8;padding:4px 8px;border-radius:6px;margin:14px 0 4px}.rpt h3{font-size:14px;margin:8px 0 4px}.rpt table.meta{width:auto;font-size:12px;background:none}.rpt table.meta th{text-align:right;padding:2px 8px;color:#555;background:none;border:0}.rpt table.meta td{padding:2px 8px;border:0;text-align:right}.rpt table.t{width:100%;font-size:12px;border-collapse:collapse;background:#fff}.rpt table.t th{background:#0f766e;color:#fff;padding:5px;border:1px solid #0f766e}.rpt table.t td{border:1px solid #c5d0cc;padding:4px 6px;text-align:right;vertical-align:top}.rpt .na{color:#b45309}.rpt .nt{color:#5b6b66;font-size:11px}.rpt tr.tot td{font-weight:700;background:#f4f6f5}.rpt footer{margin-top:14px;font-size:11px;color:#555;border-top:1px solid #ccc;padding-top:6px}.rpt .notes{background:#f4f6f5;padding:6px;margin-top:6px;font-size:12px}.pv{overflow-x:auto}#printroot{display:none}
@media print{body>*:not(#printroot){display:none!important}#printroot{display:block!important}body{background:#fff;padding:0}@page{size:A4;margin:16mm 12mm 16mm;@bottom-center{content:"صفحة " counter(page) " من " counter(pages);font-size:10px;color:#555}}.rpt thead{display:table-header-group}.rpt tr{page-break-inside:avoid}.rpt h2,.rpt h3{page-break-after:avoid}}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline:4px 2px}
#toast{position:fixed;top:12px;inset-inline:12px;background:#18211f;color:#fff;padding:10px;border-radius:10px;opacity:0;pointer-events:none;text-align:center;z-index:9}#toast.show{opacity:1}
</style></head><body><div id="app"></div><div id="modal"></div><div id="toast"></div>
<script src="logic.js"></script><script src="reports.js"></script><script src="xlsx.js"></script><script src="data.js"></script><script src="app.js"></script></body></html>
